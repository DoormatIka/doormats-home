			html {
				visibility: hidden;
			}
		</style>

		<noscript>
			<style>
				html {
					visibility: visible;
				}
			</style>
		</noscript>

		<link rel="icon" href="/favicon.ico?v=2" sizes="any" />

		<link rel="stylesheet" href="/shared/global.css" />
		<link rel="stylesheet" href="/shared/blockquote.css" />
		<link rel="stylesheet" href="/shared/list.css" />
		<link rel="stylesheet" href="/shared/kaban.css" />

		<script type="module" src="/shared/cursor-init.js" defer></script>
		<script type="module" src="/index.js" defer></script>

		<link rel="stylesheet" href="/shared/media-queries.css" />

	<body>
		<div id="umbrella-background"></div>
		<div class="center">
			<div class="cursor" data-ease="0.005"></div>
			<div class="cursor" data-ease="0.02"></div>
			<div class="cursor" data-ease="0.1"></div>
			<div
				role="button"
				tabindex="1"
				id="scrollbar-thumb"
				class="scrollbar-thumb"
			></div>

			<div class="big-box-width nav">
				<button
					id="maximize-btn"
					aria-label="maximize window"
					aria-pressed="false"
				>
					<svg
						viewBox="0 0 16 16"
						width="16"
						height="16"
						fill="none"
						stroke="currentColor"
						stroke-width="1.5"
						stroke-linecap="square"
						aria-hidden="true"
					>
						<!-- maximize: corners point outward -->
						<path class="icon-max" d="M2 6V2h4M10 2h4v4M2 10v4h4M14 10v4h-4" />
						<!-- minimize: corners point inward -->
						<path class="icon-min" d="M6 2v4H2M10 2v4h4M2 10h4v4M14 10h-4v4" />
					</svg>
				</button>
			</div>

			<div class="main-container big-box">
				<div class="max-item home-content">
					<main
						data-router="spa"
						class="max-item main-content flex-scrollable shell"
					>
						<!-- SLOT SLOT SLOT -->
						<noscript>
							<p>Please enable JS for this page!</p>
						</noscript>
					</main>

					<nav class="side-nav">
						<header>
							<h1 class="title">mu's</h1>
						</header>
						<div class="side-nav-scroll">
							<div id="scrollbar" class="divider-vertical">
								<svg viewBox="0 0 100 100" preserveAspectRatio="none">
									<line x1="50%" x2="50%" y1="0" y2="100%" />
									Sorry, your browser does not support inline SVG.
								</svg>
							</div>
							<div class="side-nav-content scroll-side-nav-padding">
								<a data-route="spa" href="#/">room</a>
								<a data-route="spa" href="#/about">about</a>
								<a data-route="spa" href="#/shrine">shrine</a>
								<a data-route="spa" href="#/todo">todo</a>
							</div>
						</div>
					</nav>
				</div>
			</div>

			<div class="main-container big-box-width nav">
				<div data-breadcrumb class="breadcrumb"></div>
				<div data-random class="no-flex-shrink"></div>
			</div>
		</div>
	</body>
