name: doormats-home

services:
  watcher:
    build: ./watcher
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/deploy/docker-compose.yml:ro
      - ./.env:/deploy/.env:ro
      - watcher_state:/app/state
      - web:/deploy/web
      - server:/deploy/server

  web:
    image: caddy:2
    restart: unless-stopped
    ports: ["9080:80", "9443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web:/srv/site:ro
      - caddy_data:/data

  server:
    build: ./server # resolves to /deploy/server inside the watcher
    ports: ["9980:9980"]
    restart: unless-stopped

volumes:
  { watcher_state: {}, web: {}, server: {}, caddy_data: {}, server_db: {} }
